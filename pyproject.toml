[project]
name = "docling-rag-pipeline"
version = "0.1.0"
description = "RAG pipeline for querying PDF reports, using Docling for parsing and LanceDB for retrieval."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docling>=2.115.0",
    "ipykernel>=7.3.0",
    "lancedb>=0.34.0",
    "openai>=2.48.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.60.0",
    "tiktoken>=0.13.0",
]
