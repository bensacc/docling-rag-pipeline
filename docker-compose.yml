services:
  docling-rag:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ${DOCLING_DATA_DIR:-./data}:/data
    env_file:
      - .env
    environment:
      # Match this to how many CPUs you've given Docker Desktop
      # (Settings -> Resources) for best ingestion performance.
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-4}
